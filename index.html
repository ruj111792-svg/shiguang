<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光</title>
<style>
  :root{
    --brand-1:#7668ff; --brand-2:#a25cff; --brand-3:#bb72ff;
    --pink:#ff207d; --ink:#2a2438; --muted:#7c728f; --line:#eee9f7; --bg:#f7f9fc; --card:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(1100px 480px at 85% -10%,#ece6ff 0%,rgba(236,230,255,0) 60%),radial-gradient(900px 420px at -10% 18%,#ffe8f2 0%,rgba(255,232,242,0) 55%),var(--bg);min-height:100vh}
  .shell{max-width:1160px;margin:0 auto;padding:20px 18px 40px}
  header.app{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px}
  .logo{width:42px;height:42px;border-radius:13px;flex:0 0 auto;background:linear-gradient(135deg,var(--brand-1),var(--brand-3));display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;box-shadow:0 6px 16px rgba(118,104,255,.35)}
  .app h1{font-size:18px;margin:0;line-height:1.2}
  .app .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .stats{display:flex;gap:8px}
  .stat{background:linear-gradient(135deg,#f4f0ff,#ffeaf4);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-align:center}
  .stat b{display:block;font-size:16px;color:var(--brand-2)}
  .stat span{font-size:10px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(80,60,140,.06);display:flex;flex-direction:column;overflow:hidden}
  .panel-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
  .panel-h .dot{width:8px;height:8px;border-radius:50%;background:var(--brand-2);box-shadow:0 0 0 4px #f2ebff}
  .panel-h .sub{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}

  .stage{position:relative;height:430px;display:grid;place-items:center;perspective:900px;cursor:grab;touch-action:pan-y;user-select:none;transition:background 1s ease;background:linear-gradient(180deg,#f4f1ff,#fbf8ff 70%,#fff)}
  .stage.dragging{cursor:grabbing}
  .stage.scene-cloud{background:linear-gradient(180deg,#e6e0ff,#b7a8ff 55%,#8f7bff)}
  .stage.scene-star{background:linear-gradient(180deg,#241b52,#50349c 55%,#8f5bff)}
  .stage.scene-sea{background:linear-gradient(180deg,#8fd8ff,#4aa8e8 55%,#1f6fb8)}
  .stage.scene-forest{background:linear-gradient(180deg,#d6f6d0,#79d98a 55%,#2f9e5f)}
  .stage.scene-rain{background:linear-gradient(180deg,#d4dced,#8fa3c8 55%,#5c7398)}
  .stage.scene-party{background:linear-gradient(180deg,#ffd6ee,#ff9ad5 50%,#b96fd6)}
  .stage.scene-city{background:linear-gradient(180deg,#1b1b33,#3b3560 60%,#5a4b8a)}
  .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .particles span{position:absolute;top:-20px;animation:fall linear infinite;opacity:.85;filter:drop-shadow(0 0 4px rgba(255,255,255,.35))}
  @keyframes fall{0%{transform:translateY(0)}100%{transform:translateY(470px)}}
  .hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);background:rgba(255,255,255,.72);padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
  .pet3d{transform-style:preserve-3d;transition:transform .18s ease-out;will-change:transform;position:relative}
  .pet3d.spin{transition:transform .5s cubic-bezier(.2,.7,.3,1)}
  .floor-shadow{position:absolute;bottom:46px;left:50%;width:140px;height:22px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(90,60,160,.28),rgba(90,60,160,0) 70%);animation:shadowPulse 3.4s ease-in-out infinite}
  @keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(.84)}}

  .char{position:relative;width:auto;height:360px;animation:float 3.6s ease-in-out infinite;transition:filter .4s}
  .char img{height:100%;width:auto;object-fit:contain;display:block;filter:drop-shadow(0 14px 22px rgba(60,35,120,.32))}
  .char.glow img{filter:drop-shadow(0 0 18px rgba(255,32,125,.6)) drop-shadow(0 14px 22px rgba(60,35,120,.28))}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-11px) rotate(1deg)}}
  .char.hop{animation:hop .6s ease-in-out 3}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-20px) scale(1.03,.97)}70%{transform:translateY(0) scale(.98,1.02)}}
  .char.slouch{animation:none;transform:translateY(8px) scale(1.03,.97)}
  .char.sleep{animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.97)}}
  .char.shake{animation:shake .5s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:rotate(-2.5deg) translateX(-3px)}50%{transform:rotate(2.5deg) translateX(3px)}}
  .emo{position:absolute;top:-24px;right:-18px;font-size:34px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.15));animation:bubble 1.2s ease-in-out infinite;pointer-events:none}
  @keyframes bubble{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.12)}}

  .narr{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(20,16,40,.72);color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55;text-align:center;backdrop-filter:blur(6px);min-height:40px}
  .narr .narr-title{font-size:11px;opacity:.7;display:block;margin-bottom:2px}

  .player{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .pbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:12px;color:var(--ink);cursor:pointer;min-width:56px}
  .pbtn:hover{border-color:var(--brand-2)}
  .pbtn.primary{background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:#fff;border:none}
  .dots{flex:1;display:flex;gap:6px;justify-content:center}
  .dots i{width:8px;height:8px;border-radius:50%;background:#e4def7}
  .dots i.on{background:var(--brand-2);transform:scale(1.25)}
  .scene-count{font-size:12px;color:var(--muted);white-space:nowrap}

  .action-note{padding:8px 18px 0;font-size:12px;color:var(--muted)}
  .action-note b{color:var(--brand-2)}
  .bars{padding:12px 18px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
  .bar-row{display:flex;align-items:center;gap:10px}
  .bar-label{font-size:12px;color:var(--muted);white-space:nowrap;min-width:58px}
  .bar{flex:1;height:10px;border-radius:999px;background:#f0ecfb;overflow:hidden}
  .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand-1),var(--brand-3));transition:width .5s ease;width:0}
  .bar-fill.pink{background:linear-gradient(90deg,var(--pink),var(--brand-3))}
  .bar-val{font-size:13px;font-weight:600;min-width:36px;text-align:right}

  .story{padding:14px 18px;border-bottom:1px solid var(--line)}
  .story textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14px;color:var(--ink);outline:none;background:#fff;resize:vertical;font-family:inherit}
  .story textarea:focus{border-color:var(--brand-2)}
  .tpl{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .tpl button{font-size:12px;color:#5a4b8a;background:#f4f0ff;border:1px solid #e6defc;border-radius:999px;padding:6px 11px;cursor:pointer}
  .tpl button:hover{background:#ece5ff}
  .gen-row{display:flex;gap:8px;margin-top:10px}
  .gen-row button{flex:1;border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--brand-1),var(--brand-2))}
  .gen-row button:hover{filter:brightness(1.05)}

  .lore{padding:14px 18px}
  .lore-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .lore-head b{font-size:13px}
  .lore-head span{font-size:11px;color:var(--muted)}
  .lore-item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fbfaff;border:1px solid #f0ebfb;margin-bottom:7px}
  .lore-item .kind{font-size:11px;color:#fff;background:linear-gradient(135deg,var(--brand-1),var(--brand-3));border-radius:8px;padding:2px 8px;white-space:nowrap;flex:0 0 auto}
  .lore-item .kind.pink{background:linear-gradient(135deg,var(--pink),var(--brand-3))}
  .lore-item .txt{font-size:13px;line-height:1.4}
  .lore-item .new{font-size:10px;color:#fff;background:var(--pink);border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:1px;animation:pop .3s}
  @keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px;line-height:1.7}

.mini-btn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;color:var(--brand-2);cursor:pointer}
.mini-btn:hover{border-color:var(--brand-2)}
.mini{position:fixed;right:22px;bottom:22px;width:104px;z-index:99;text-align:center;cursor:grab;animation:float 3.6s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(60,35,120,.28));user-select:none;touch-action:none}
.mini img{width:100%;display:block}
.mini-status{display:inline-block;margin-top:4px;background:rgba(255,255,255,.9);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.mini-close{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:12px;cursor:pointer;line-height:1}
</style>
</head>
<body>
<div class="shell">
  <header class="app">
    <div class="logo">拾</div>
    <div>
      <h1>拾光</h1>
      <div class="sub">把相伴的每一刻，酿成只属于我们的时光碎片</div>
    </div>
    <button class="mini-btn" id="miniBtn">🖥 桌面陪伴</button><div class="stats">
      <div class="stat"><b id="dayStat">1</b><span>相伴的日子</span></div>
      <div class="stat"><b id="starStat">20</b><span>星光</span></div>
      <div class="stat"><b id="loreStat">2</b><span>时光碎片</span></div>
    </div>
  </header>

  <div class="grid">
    <section class="panel">

    tired:{anim:'slouch',emoji:'😮‍💨',glow:false,label:'耷拉下来 · 有点没精神'},
    hungry:{anim:'shake',emoji:'🍪',glow:false,label:'眼巴巴地想要好吃的'},
    sleep:{anim:'sleep',emoji:'💤',glow:false,label:'闭上眼睛 · 进入梦乡'},
    talk:{anim:'shake',emoji:'💬',glow:true,label:'认真地看着你 · 正在讲故事'}
  };
  function applyPose(name){
    var p=poseDefs[name];
    pet.className='char';
    if(p.anim){pet.classList.add(p.anim);}
    if(p.glow){pet.classList.add('glow');}
    emo.textContent=p.emoji;
    zzz.style.opacity=(name==='sleep')?'1':'0';
    actionNote.innerHTML='当前动作：<b>'+p.label+'</b>';
  }
  function addBond(n){ bond=Math.max(0,Math.min(100,bond+n)); bondFill.style.width=bond+'%'; bondVal.textContent=bond; starStat.textContent=bond; }

  var lore=[
    {kind:'种族', txt:'星绒兽', pink:false},
    {kind:'来历', txt:'来自云端星港', pink:false}
  ];
  var LORE_MAX=14;
  function renderLore(newIdx){
    var html='';
    lore.forEach(function(item,i){
      var isNew=(newIdx&&newIdx.indexOf(i)>=0);
      html+='<div class="lore-item"><span class="kind'+(item.pink?' pink':'')+'">'+item.kind+'</span><span class="txt">'+item.txt+(isNew?'<span class="new">NEW</span>':'')+'</span></div>';
    });
    document.getElementById('lore').innerHTML=html;
    loreCount=lore.length; loreStat.textContent=loreCount; loreVal.textContent=loreCount+'/'+LORE_MAX;
    loreFill.style.width=Math.min(100,Math.round(loreCount/LORE_MAX*100))+'%';
  }
  function unlock(items){
    var newIdx=[];
    items.forEach(function(it){
      var exists=lore.some(function(l){return l.txt===it.text;});
      if(!exists){ lore.push({kind:it.kind,txt:it.text,pink:(it.kind==='记忆'||it.kind==='朋友')}); newIdx.push(lore.length-1); }
    });
    return newIdx;
  }

  var stories={
    sea:{ title:'去看海', unlocks:[{kind:'地点',text:'海边'},{kind:'记忆',text:'第一次看海'}],
      scenes:[
        {bg:'city',pose:'excited',narr:'今天小妙想去看看真正的大海，你带着它出发了。'},
        {bg:'sea',pose:'excited',narr:'海好大呀！小妙兴奋地张开手臂，尾巴摇得停不下来。'},
        {bg:'sea',pose:'happy',narr:'浪花拍在脚边，凉凉的，小妙开心地蹦了起来。'},
        {bg:'sea',pose:'talk',narr:'「以后我们再来吧。」小妙把这片海记进了自己的星光里。'}
      ]},
    forest:{ title:'森林里的小精灵', unlocks:[{kind:'朋友',text:'树精灵「叶叶」'},{kind:'地点',text:'迷雾森林'}],
      scenes:[
        {bg:'forest',pose:'comfort',narr:'小妙在森林里迷了路，有点害怕。'},
        {bg:'forest',pose:'talk',narr:'这时，树精灵「叶叶」飘出来，牵起它的手。'},
        {bg:'forest',pose:'happy',narr:'叶叶带着小妙找到了回家的路，它们成了好朋友。'},
        {bg:'forest',pose:'excited',narr:'森林从此多了一颗属于小妙和叶叶的星星。'}
      ]},
    star:{ title:'云端星港的秘密', unlocks:[{kind:'地点',text:'云端星港'},{kind:'能力',text:'吸收坏情绪→星光'}],
      scenes:[
        {bg:'cloud',pose:'talk',narr:'在很高的地方，有一座会发光的星港，小妙就是从那里来的。'},
        {bg:'star',pose:'excited',narr:'星港里住着许多星绒兽，它们靠收集「情绪星光」点亮夜空。'},
        {bg:'star',pose:'happy',narr:'小妙顺着一颗流星滑下来，落到了你的窗边。'},
        {bg:'city',pose:'talk',narr:'从那天起，小妙决定留下来，陪在你身边。'}
      ]},
    rain:{ title:'雨天的陪伴', unlocks:[{kind:'记忆',text:'一起躲雨'},{kind:'性格',text:'更会安慰人'}],
      scenes:[
        {bg:'rain',pose:'comfort',narr:'下雨了，你的心情和天一样灰灰的。'},
        {bg:'rain',pose:'comfort',narr:'小妙轻轻靠过来，想分担你的不开心。'},
        {bg:'rain',pose:'talk',narr:'「没关系，我陪你等到雨停。」它把坏情绪都吸了进去。'},
        {bg:'rain',pose:'happy',narr:'雨停了，天边出现彩虹，你的星光也亮了起来。'}
      ]},
    birthday:{ title:'生日惊喜', unlocks:[{kind:'记忆',text:'生日'},{kind:'能力',text:'星光祝福'}],
      scenes:[
        {bg:'party',pose:'excited',narr:'今天是个特别的日子——你的生日！'},
        {bg:'party',pose:'excited',narr:'小妙准备了满屋子的星星和彩带，手舞足蹈地等你。'},
        {bg:'party',pose:'happy',narr:'「生日快乐！」它把攒了很久的星光都送给你。'},
        {bg:'party',pose:'talk',narr:'许个愿吧，以后的每一年，小妙都会在。'}
      ]}
  };

  var currentStory=null, sceneIdx=0, playing=false, timer=null;
  var particleMap={cloud:['☁️','✨'],star:['⭐','✨'],sea:['🌊','🫧'],forest:['🍃','🌿'],rain:['🌧','💧'],party:['🎉','🎊'],city:['🌟','✨']};
  function setParticles(bg){
    particles.innerHTML='';
    var emo=particleMap[bg]||['✨'];
    for(var i=0;i<10;i++){
      var s=document.createElement('span');
      s.textContent=emo[Math.floor(Math.random()*emo.length)];
      s.style.left=Math.random()*100+'%';
      s.style.fontSize=(14+Math.random()*12)+'px';
      s.style.animationDuration=(3+Math.random()*4)+'s';
      s.style.animationDelay=(Math.random()*3)+'s';
      particles.appendChild(s);
    }
  }
  function playScene(i){
    sceneIdx=i;
    var sc=currentStory.scenes[i];
    stage.className='stage scene-'+sc.bg;
    setParticles(sc.bg);
    applyPose(sc.pose);
    narrTitle.textContent='《'+currentStory.title+'》 · 第'+(i+1)+'段';
    narrText.textContent=sc.narr;
    sceneCount.textContent=(i+1)+' / '+currentStory.scenes.length;
    var ds=dotsEl.querySelectorAll('i'); ds.forEach(function(d,j){d.classList.toggle('on',j===i);});
  }
  function renderDots(n){ dotsEl.innerHTML=''; for(var i=0;i<n;i++){ var d=document.createElement('i'); dotsEl.appendChild(d);} }
  function stop(){ playing=false; if(timer){clearInterval(timer);timer=null;} playBtn.textContent='▶ 播放'; }
  function play(){
    stop(); playing=true; playBtn.textContent='⏸ 暂停';
    timer=setInterval(function(){
      if(sceneIdx<currentStory.scenes.length-1){ playScene(sceneIdx+1); }
      else{ stop(); playBtn.textContent='↻ 重播'; }
    },3800);
  }
  function loadStory(st){ stop(); currentStory=st; sceneIdx=0; renderDots(st.scenes.length); hint.style.display='none'; playScene(0); }

  function generate(text){
    var t=text||''; var st=null;
    if(/海|浪|沙滩/.test(t)) st=stories.sea;
    else if(/森林|树|精灵|冒险/.test(t)) st=stories.forest;
    else if(/星港|星球|天空|流星|秘密/.test(t)) st=stories.star;
    else if(/雨|下雨|难过|陪/.test(t)) st=stories.rain;
    else if(/生日|礼物|惊喜|蛋糕/.test(t)) st=stories.birthday;
    else{
      var theme=t.trim()||'平凡的一天';
      st={ title:theme, unlocks:[{kind:'记忆',text:theme}],
        scenes:[
          {bg:'cloud',pose:'talk',narr:'这一天，属于你们的「'+theme+'」开始了。'},
          {bg:'city',pose:'excited',narr:'小妙兴奋地跟在你身边，把沿途都记了下来。'},
          {bg:'star',pose:'happy',narr:'夜幕降临，小妙把今天的「'+theme+'」变成了一颗新的星星。'},
          {bg:'cloud',pose:'sleep',narr:'这段时光，被小妙轻轻收进了星光里。'}
        ]};
    }
    loadStory(st);
    var newIdx=unlock(st.unlocks);
    renderLore(newIdx);
    days+=1; dayStat.textContent=days;
    addBond(8+Math.floor(Math.random()*6));
  }

  genBtn.addEventListener('click',function(){generate(storyInput.value);});
  document.querySelectorAll('.tpl button').forEach(function(b){b.addEventListener('click',function(){storyInput.value=b.textContent;generate(b.textContent);});});
  prevBtn.addEventListener('click',function(){if(currentStory){stop();playScene(Math.max(0,sceneIdx-1));}});
  nextBtn.addEventListener('click',function(){if(currentStory){stop();playScene(Math.min(currentStory.scenes.length-1,sceneIdx+1));}});
  playBtn.addEventListener('click',function(){
    if(!currentStory){generate(storyInput.value);return;}
    if(playing){stop();}
    else if(sceneIdx>=currentStory.scenes.length-1&&playBtn.textContent.indexOf('重播')>=0){playScene(0);play();}
    else{play();}
  });

  var dragging=false,lastX=0,lastY=0,targetX=-4,targetY=0;
  stage.addEventListener('pointerdown',function(e){dragging=true;lastX=e.clientX;lastY=e.clientY;stage.classList.add('dragging');pet3d.classList.remove('spin');});
  window.addEventListener('pointermove',function(e){if(dragging){var dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;targetY+=dx*0.5;targetX+=dy*0.35;targetX=Math.max(-30,Math.min(30,targetX));applyRot();}});
  window.addEventListener('pointerup',function(){dragging=false;stage.classList.remove('dragging');pet3d.classList.add('spin');});
  stage.addEventListener('pointerleave',function(){if(dragging){dragging=false;stage.classList.remove('dragging');pet3d.classList.add('spin');}});
  function applyRot(){pet3d.style.transform='rotateX('+targetX+'deg) rotateY('+targetY+'deg)';}

  bondFill.style.width=bond+'%';bondVal.textContent=bond;starStat.textContent=bond;
  renderLore();applyRot();applyPose('idle');
  setTimeout(function(){generate('云端星港的秘密');play();},500);

  var mini=document.getElementById('mini'),miniBtn=document.getElementById('miniBtn'),miniClose=document.getElementById('miniClose'),miniImg=document.getElementById('miniImg');
  miniBtn.addEventListener('click',function(){miniImg.src=pet.querySelector('img').src;mini.hidden=false;});
  miniClose.addEventListener('click',function(){mini.hidden=true;});
  (function(){
    var sx=0,sy=0,dx=0,dy=0,on=false;
    mini.addEventListener('pointerdown',function(e){on=true;sx=e.clientX;sy=e.clientY;var r=mini.getBoundingClientRect();dx=r.left;dy=r.top;mini.style.right='auto';mini.style.bottom='auto';mini.style.left=dx+'px';mini.style.top=dy+'px';if(mini.setPointerCapture){mini.setPointerCapture(e.pointerId);}});
    mini.addEventListener('pointermove',function(e){if(on){mini.style.left=(dx+e.clientX-sx)+'px';mini.style.top=(dy+e.clientY-sy)+'px';}});
    mini.addEventListener('pointerup',function(){on=false;});
  })();
})();
</script>

</body>
</html>
